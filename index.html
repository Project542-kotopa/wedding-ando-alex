<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Alex &amp; Ando – Wedding</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#faf6ef;--card:#fffdf8;--ink:#2b2a26;--mute:#7a7467;--sage:#7d8f76;--gold:#b8924a;--line:#e6dcc8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1b18;--card:#25241f;--ink:#f1ead9;--mute:#a79f8d;--sage:#9db395;--gold:#d3ad66;--line:#3a382f}}
:root[data-theme="dark"]{--bg:#1c1b18;--card:#25241f;--ink:#f1ead9;--mute:#a79f8d;--sage:#9db395;--gold:#d3ad66;--line:#3a382f}
*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Jost,system-ui,sans-serif;font-weight:300;line-height:1.6}
h1,h2,h3{font-family:'Cormorant Garamond',Georgia,serif;font-weight:400;margin:0}
.lang{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:12px;z-index:5;display:flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:3px}
.lang button{border:0;background:none;color:var(--mute);padding:5px 12px;border-radius:99px;font:500 13px Jost,sans-serif;cursor:pointer}
.lang button.on{background:var(--sage);color:#fff}
.hero{min-height:100vh;min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:70px 20px 40px;position:relative;overflow:hidden}
.hero svg.fl{position:absolute;width:260px;opacity:.55;color:var(--sage)}
.fl.a{top:-30px;left:-50px}.fl.b{bottom:-30px;right:-50px;transform:rotate(180deg)}
.kicker{letter-spacing:.3em;text-transform:uppercase;font-size:12px;color:var(--gold)}
.names{font-size:clamp(52px,14vw,110px);line-height:1;margin:14px 0}
.names i{color:var(--gold);font-size:.6em;padding:0 .12em}
.date{font-family:'Cormorant Garamond',serif;font-size:clamp(20px,5vw,28px)}
.cd{display:flex;gap:14px;margin-top:28px}
.cd div{min-width:64px;padding:10px 6px;border:1px solid var(--line);background:var(--card);border-radius:10px}
.cd b{display:block;font:600 26px 'Cormorant Garamond',serif;color:var(--gold)}.cd span{font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.1em}
.btn{display:inline-block;margin-top:30px;background:var(--sage);color:#fff;border:0;padding:13px 30px;border-radius:99px;font:500 15px Jost,sans-serif;text-decoration:none;cursor:pointer}
section{max-width:820px;margin:0 auto;padding:60px 20px;text-align:center}
section h2{font-size:clamp(34px,8vw,48px);margin-bottom:8px}
.orn{display:block;margin:6px auto 22px;color:var(--gold)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px;margin-top:26px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px 18px}
.card h3{font-size:26px;color:var(--sage)}.card p{margin:6px 0;color:var(--mute)}
.tl{max-width:420px;margin:24px auto 0;text-align:left}
.tl div{display:flex;gap:16px;padding:10px 0;border-bottom:1px dashed var(--line)}.tl b{min-width:58px;color:var(--gold);font-weight:500}
form{max-width:480px;margin:24px auto 0;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px}
label{display:block;font-size:13px;color:var(--mute);margin:14px 0 5px}
input,textarea,select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink);font:400 16px Jost,sans-serif}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.seg{display:flex;gap:8px}.seg label{flex:1;margin:0;text-align:center;border:1px solid var(--line);border-radius:9px;padding:11px;cursor:pointer;color:var(--ink);font-size:15px}
.seg input{display:none}.seg input:checked+span{color:var(--sage);font-weight:500}.seg label:has(input:checked){border-color:var(--sage);background:color-mix(in srgb,var(--sage) 14%,transparent)}
form .btn{width:100%;margin-top:22px}
.msg{margin-top:14px;padding:12px;border-radius:9px;font-size:14px;text-align:center}
.ok{background:color-mix(in srgb,var(--sage) 20%,transparent)}.err{background:color-mix(in srgb,#c0504d 16%,transparent)}
footer{text-align:center;padding:40px 20px;color:var(--mute);font-size:13px}
</style>
</head>
<body>
<div class="lang"><button data-l="el">ΕΛ</button><button data-l="en">EN</button></div>

<header class="hero">
<svg class="fl a" viewBox="0 0 200 200" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M10 190C50 120 90 80 190 20"/><g fill="currentColor" fill-opacity=".25"><ellipse cx="60" cy="140" rx="9" ry="22" transform="rotate(-40 60 140)"/><ellipse cx="90" cy="108" rx="9" ry="22" transform="rotate(-30 90 108)"/><ellipse cx="125" cy="78" rx="9" ry="22" transform="rotate(-20 125 78)"/><ellipse cx="150" cy="140" rx="8" ry="20" transform="rotate(30 150 140)"/><ellipse cx="55" cy="95" rx="8" ry="20" transform="rotate(35 55 95)"/></g></svg>
<svg class="fl b" viewBox="0 0 200 200" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M10 190C50 120 90 80 190 20"/><g fill="currentColor" fill-opacity=".25"><ellipse cx="60" cy="140" rx="9" ry="22" transform="rotate(-40 60 140)"/><ellipse cx="90" cy="108" rx="9" ry="22" transform="rotate(-30 90 108)"/><ellipse cx="125" cy="78" rx="9" ry="22" transform="rotate(-20 125 78)"/><ellipse cx="150" cy="140" rx="8" ry="20" transform="rotate(30 150 140)"/><ellipse cx="55" cy="95" rx="8" ry="20" transform="rotate(35 55 95)"/></g></svg>
<div class="kicker" data-t="kicker"></div>
<h1 class="names"><span id="n1"></span><i>&amp;</i><span id="n2"></span></h1>
<div class="date" id="dateTxt"></div>
<div class="cd" id="cd"></div>
<a class="btn" href="#rsvp" data-t="cta"></a>
</header>

<section>
<h2 data-t="detT"></h2>
<svg class="orn" width="120" height="24" viewBox="0 0 120 24" fill="none" stroke="currentColor" stroke-width="1.3"><circle cx="50" cy="12" r="7"/><circle cx="70" cy="12" r="7"/><path d="M0 12h38M82 12h38"/></svg>
<p data-t="detP"></p>
<div class="grid">
<div class="card"><h3 data-t="cer"></h3><p id="cerW"></p><p id="cerP"></p></div>
<div class="card"><h3 data-t="rec"></h3><p id="recW"></p><p id="recP"></p></div>
</div>
<div class="tl" id="tl"></div>
</section>

<section id="rsvp">
<h2 data-t="rsvpT"></h2>
<svg class="orn" width="120" height="24" viewBox="0 0 120 24" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M60 20C40 8 40 2 52 4c4 1 8 6 8 6s4-5 8-6c12-2 12 4-8 16z"/><path d="M0 12h38M82 12h38"/></svg>
<p data-t="rsvpP"></p>
<form id="f" novalidate>
<label data-t="name"></label><input id="name" required autocomplete="name">
<label data-t="contact"></label><input id="contact" required autocomplete="email">
<label data-t="att"></label>
<div class="seg"><label><input type="radio" name="att" value="yes" checked><span data-t="yes"></span></label><label><input type="radio" name="att" value="no"><span data-t="no"></span></label></div>
<div id="more">
<div class="row"><div><label data-t="extra"></label><input id="extra" type="number" min="0" max="10" value="0"></div>
<div><label data-t="kids"></label><input id="kids" type="number" min="0" max="10" value="0"></div></div>
<label data-t="note"></label><textarea id="note" rows="3"></textarea>
</div>
<button class="btn" type="submit" data-t="send"></button>
<div id="out"></div>
</form>
</section>
<footer>Alex &amp; Ando · <span id="yr"></span></footer>

<script>
const CFG={
  n1:"Alex", n2:"Ando",
  date:"2027-07-10T18:00:00",            // ΑΛΛΑΞΕ ΤΗΝ ΗΜΕΡΟΜΗΝΙΑ
  endpoint:"https://formspree.io/f/xppqeyod",                           // URL Formspree (https://formspree.io/f/xxxx) ή Google Apps Script
  email:"alexkotop@gmail.com",         // email για εναλλακτική αποστολή
  cer:{el:["Εκκλησία / Δημαρχείο","Όνομα χώρου, Θεσσαλονίκη"],en:["Church / Town Hall","Venue name, Thessaloniki"]},
  rec:{el:["Δεξίωση","Όνομα χώρου, Θεσσαλονίκη"],en:["Reception","Venue name, Thessaloniki"]},
  tl:[["18:00",{el:"Τελετή",en:"Ceremony"}],["20:00",{el:"Δεξίωση & δείπνο",en:"Reception & dinner"}],["22:00",{el:"Χορός & γλέντι",en:"Dancing & party"}]]
};
const T={
el:{kicker:"Παντρευόμαστε",cta:"Επιβεβαίωση παρουσίας",detT:"Η μεγάλη μέρα",detP:"Με χαρά σας προσκαλούμε να γιορτάσετε μαζί μας τη μέρα του γάμου μας.",cer:"Τελετή",rec:"Δεξίωση",rsvpT:"Θα έρθετε;",rsvpP:"Παρακαλούμε επιβεβαιώστε την παρουσία σας το συντομότερο.",name:"Ονοματεπώνυμο",contact:"Email ή τηλέφωνο",att:"Θα παρευρεθείτε;",yes:"Ναι, με χαρά!",no:"Δυστυχώς όχι",extra:"Επιπλέον άτομα (συνολικά)",kids:"Εκ των οποίων παιδιά <5 ετών",note:"Μήνυμα / διατροφικές ανάγκες",send:"Αποστολή",d:["Ημέρες","Ώρες","Λεπτά","Δευτ."],ok:"Ευχαριστούμε! Η απάντησή σας καταγράφηκε.",bad:"Συμπληρώστε ονοματεπώνυμο και στοιχεία επικοινωνίας.",fb:"Η απευθείας καταχώριση δεν είναι διαθέσιμη. Στείλτε την απάντησή σας:",fbBtn:"Αποστολή με email / αντιγραφή",copied:"Αντιγράφηκε! Στείλτε το μήνυμα σε εμάς.",tot:"Σύνολο"},
en:{kicker:"We’re getting married",cta:"RSVP",detT:"The big day",detP:"We’re delighted to invite you to celebrate our wedding day with us.",cer:"Ceremony",rec:"Reception",rsvpT:"Will you join us?",rsvpP:"Please confirm your attendance as soon as you can.",name:"Full name",contact:"Email or phone",att:"Will you attend?",yes:"Yes, with joy!",no:"Sadly, no",extra:"Additional guests (total)",kids:"Of which children under 5",note:"Message / dietary needs",send:"Submit",d:["Days","Hours","Min","Sec"],ok:"Thank you! Your response has been recorded.",bad:"Please fill in your name and contact details.",fb:"Direct submission isn’t available. Send your reply instead:",fbBtn:"Send by email / copy",copied:"Copied! Please send the message to us.",tot:"Total"}
};
let L=(navigator.language||"el").startsWith("en")?"en":"el";
const $=id=>document.getElementById(id), D=new Date(CFG.date);
function render(){
  document.documentElement.lang=L;const t=T[L];
  document.querySelectorAll("[data-t]").forEach(e=>e.innerHTML=t[e.dataset.t]);
  document.querySelectorAll(".lang button").forEach(b=>b.classList.toggle("on",b.dataset.l===L));
  $("n1").textContent=CFG.n1;$("n2").textContent=CFG.n2;$("yr").textContent=D.getFullYear();
  $("dateTxt").textContent=D.toLocaleDateString(L==="el"?"el-GR":"en-GB",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
  $("cerW").textContent=CFG.cer[L][0];$("cerP").textContent=CFG.cer[L][1];$("recW").textContent=CFG.rec[L][0];$("recP").textContent=CFG.rec[L][1];
  $("tl").innerHTML=CFG.tl.map(r=>`<div><b>${r[0]}</b><span>${r[1][L]}</span></div>`).join("");
  tick();
}
function tick(){
  let s=Math.max(0,Math.floor((D-Date.now())/1000));const v=[Math.floor(s/86400),Math.floor(s%86400/3600),Math.floor(s%3600/60),s%60];
  $("cd").innerHTML=v.map((n,i)=>`<div><b>${n}</b><span>${T[L].d[i]}</span></div>`).join("");
}
setInterval(tick,1000);
document.querySelectorAll(".lang button").forEach(b=>b.onclick=()=>{L=b.dataset.l;render()});
document.querySelectorAll("input[name=att]").forEach(r=>r.onchange=()=>$("more").style.display=document.querySelector("input[name=att]:checked").value==="yes"?"":"none");

$("f").onsubmit=async e=>{
  e.preventDefault();const t=T[L],out=$("out");
  const name=$("name").value.trim(),contact=$("contact").value.trim();
  if(!name||!contact){out.innerHTML=`<div class="msg err">${t.bad}</div>`;return}
  const att=document.querySelector("input[name=att]:checked").value;
  const extra=att==="yes"?Math.max(0,+$("extra").value||0):0;
  const kids=att==="yes"?Math.min(extra,Math.max(0,+$("kids").value||0)):0;
  const rec={name,contact,attending:att==="yes",additionalGuests:extra,childrenUnder5:kids,totalPeople:att==="yes"?1+extra:0,note:$("note").value.trim(),lang:L,createdAt:new Date().toISOString()};
  try{
    if(!CFG.endpoint)throw 0;
    if(CFG.endpoint.includes("formspree.io")){const r=await fetch(CFG.endpoint,{method:"POST",headers:{"Content-Type":"application/json","Accept":"application/json"},body:JSON.stringify(rec)});if(!r.ok)throw 0}
    else await fetch(CFG.endpoint,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain"},body:JSON.stringify(rec)});
    out.innerHTML=`<div class="msg ok">${t.ok}</div>`;$("f").reset();
  }catch(_){
    const txt=`RSVP – ${CFG.n1} & ${CFG.n2}\n${name} (${contact})\n${att==="yes"?"✔":"✘"} | ${t.tot}: ${rec.totalPeople} | <5: ${kids}\n${rec.note}`;
    out.innerHTML=`<div class="msg err">${t.fb}<br><button type="button" class="btn" id="fb" style="margin-top:10px">${t.fbBtn}</button></div>`;
    $("fb").onclick=async()=>{
      if(CFG.email){location.href=`mailto:${CFG.email}?subject=RSVP&body=${encodeURIComponent(txt)}`;return}
      try{await navigator.clipboard.writeText(txt)}catch(_){}
      out.innerHTML=`<div class="msg ok">${t.copied}</div>`;
    };
  }
};
render();
</script>
</body>
</html>
