<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Alex &amp; Ando – The Wedding Issue</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,600;1,6..96,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--ink:#0c0c0c;--iv:#f3eee3;--w:#fff;--gr:#8c8a82;--ln:rgba(12,12,12,.25);--serif:'Bodoni Moda','Didot','Bodoni 72',Georgia,serif}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--iv);color:var(--ink);font:300 16px/1.6 Jost,system-ui,sans-serif;padding-bottom:env(safe-area-inset-bottom,0px)}
body.lock{overflow:hidden}
.sm{font:500 10.5px/1.4 Jost,sans-serif;letter-spacing:.28em;text-transform:uppercase}
.lang{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:12px;z-index:30;display:flex;background:var(--iv);border:1px solid var(--ink)}
.lang button{border:0;background:none;color:var(--ink);padding:6px 12px;font:500 12px Jost,sans-serif;letter-spacing:.1em;cursor:pointer}
.lang button.on{background:var(--ink);color:var(--iv)}

/* intro: ivory paper, black ribbon + black wax seal */
#intro{position:fixed;inset:0;z-index:20;overflow:hidden;background:var(--iv)}
#intro.gone{display:none}
.pn{position:absolute;top:0;bottom:0;width:50.3%;background:linear-gradient(to bottom,transparent 33%,rgba(0,0,0,.06) 33.2%,transparent 33.7%,transparent 66%,rgba(0,0,0,.06) 66.2%,transparent 66.7%),radial-gradient(120% 90% at 50% 40%,#f7f3ea,#ebe5d8);transition:transform 1.1s cubic-bezier(.7,0,.2,1) .4s}
.pl{left:0;box-shadow:inset -16px 0 26px -20px rgba(0,0,0,.4)}.pr{right:0;box-shadow:inset 16px 0 26px -20px rgba(0,0,0,.4)}
.pn i{position:absolute;left:0;right:0;top:50%;height:70px;margin-top:-35px;background:linear-gradient(#222,#050505);box-shadow:0 3px 10px rgba(0,0,0,.35)}
#intro.open .pl{transform:translateX(-101%)}#intro.open .pr{transform:translateX(101%)}
#seal{position:absolute;left:50%;top:50%;width:min(86vw,360px);transform:translate(-50%,-50%);border:0;background:none;padding:0;cursor:pointer;z-index:3;transition:opacity .45s,transform .45s;-webkit-tap-highlight-color:transparent}
#seal svg{display:block;width:100%;height:auto;overflow:visible}
#seal .sg{transform-origin:150px 150px;animation:pul 2.4s ease-in-out infinite;filter:drop-shadow(0 4px 6px rgba(0,0,0,.45))}
@keyframes pul{50%{transform:scale(1.05)}}
#seal:active .sg{animation:none;transform:scale(.94)}
#intro.open #seal{opacity:0;transform:translate(-50%,-50%) scale(.85)}

/* photos */
.ph{position:relative;margin:0;overflow:hidden;background:linear-gradient(135deg,#1c1c1c,#6a6a66 48%,#161616)}
.ph::after{content:"PHOTO 0" attr(data-n);position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:500 10.5px Jost,sans-serif;letter-spacing:.3em;color:rgba(243,238,227,.55)}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:grayscale(1) contrast(1.08);z-index:1}

/* cover */
.cover{position:relative;min-height:100vh;min-height:100svh;background:var(--ink);color:var(--iv);display:flex;flex-direction:column;overflow:hidden}
.cover .ph{position:absolute;inset:0;opacity:.62}
.cover:before{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(180deg,rgba(12,12,12,.6),transparent 30%,transparent 45%,rgba(12,12,12,.92))}
.cover>*:not(.ph){position:relative;z-index:2}
.bar{display:flex;justify-content:space-between;padding:calc(58px + env(safe-area-inset-top,0px)) 20px 10px;border-bottom:1px solid rgba(243,238,227,.45);margin:0 20px;padding-left:0;padding-right:0}
.names{margin:auto 0 0;padding:0 14px;font:400 clamp(92px,31vw,260px)/.8 var(--serif);letter-spacing:-.045em;text-transform:uppercase;text-align:center}
.names span{display:block}.names small{font:italic 400 .32em var(--serif);letter-spacing:0;margin-right:.2em;vertical-align:.45em;text-transform:none}
.sub{text-align:center;margin:22px 0 18px}
.cl{display:grid;grid-template-columns:1fr 1fr;margin:0 20px 22px;border-top:1px solid rgba(243,238,227,.45)}
.cl a{color:var(--iv);text-decoration:none;padding:13px 0;border-bottom:1px solid rgba(243,238,227,.25);display:flex;gap:12px;align-items:baseline}
.cl a:nth-child(odd){padding-right:10px}.cl b{font:italic 400 18px var(--serif)}

/* sections */
section{padding:74px 22px}
.in{max-width:900px;margin:0 auto}
.k{display:block;color:var(--gr);margin-bottom:18px}
h2{font:400 clamp(40px,11vw,78px)/.95 var(--serif);letter-spacing:-.03em;margin:0 0 30px;text-transform:uppercase}
.q{font:italic 400 clamp(28px,7.4vw,50px)/1.12 var(--serif);letter-spacing:-.01em;margin:0 0 40px}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:0 24px}
.facts div{border-top:1px solid var(--ink);padding:12px 0 24px}
.facts .sm{display:block;color:var(--gr);margin-bottom:8px}.facts p{margin:0;font:400 19px/1.3 var(--serif)}
.strip{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.strip .ph{aspect-ratio:3/4}.strip .ph:first-child{grid-column:span 2;aspect-ratio:4/3}
.cap{display:block;margin-top:6px;color:var(--gr)}
.dark{background:var(--ink);color:var(--iv)}.dark .k{color:#9d9a90}
.loc{margin-top:36px;border-top:1px solid rgba(243,238,227,.45);padding-top:16px}
.loc h3{font:400 clamp(26px,6.5vw,38px)/1.1 var(--serif);margin:6px 0 16px}
.loc iframe{width:100%;height:260px;border:0;filter:grayscale(1) contrast(1.1);display:block}
.lnk{display:inline-block;margin-top:14px;color:var(--iv);text-decoration:none;border-bottom:1px solid var(--iv);padding-bottom:3px}
.tl div{display:flex;align-items:baseline;gap:20px;border-top:1px solid var(--ink);padding:16px 0}
.tl b{font:400 clamp(34px,9vw,52px)/1 var(--serif);min-width:132px}.tl span{font:500 12px Jost,sans-serif;letter-spacing:.24em;text-transform:uppercase}
.tl div:last-child{border-bottom:1px solid var(--ink)}
form{max-width:520px;margin-top:10px}
label{display:block;margin:20px 0 4px;color:var(--gr)}
input,textarea{width:100%;padding:10px 0;border:0;border-bottom:1px solid var(--ink);border-radius:0;background:transparent;color:var(--ink);font:400 17px Jost,sans-serif;outline:0}
.row{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.seg{display:flex;gap:10px;margin-top:6px}.seg label{flex:1;margin:0;text-align:center;border:1px solid var(--ink);padding:13px 8px;cursor:pointer;color:var(--ink)}
.seg input{display:none}.seg label:has(input:checked){background:var(--ink);color:var(--iv)}
.btn{display:block;width:100%;margin-top:30px;background:var(--ink);color:var(--iv);border:0;padding:17px;font:500 12px Jost,sans-serif;letter-spacing:.3em;text-transform:uppercase;cursor:pointer}
.msg{margin-top:16px;padding:14px;border:1px solid var(--ink);font-size:14px}
.err{background:#e8dfd0}
footer{background:var(--ink);color:var(--iv);text-align:center;padding:46px 20px calc(46px + env(safe-area-inset-bottom,0px))}
footer b{display:block;font:400 clamp(60px,20vw,150px)/.85 var(--serif);letter-spacing:-.04em;margin-bottom:18px;text-transform:uppercase}
</style>
</head>
<body class="lock">
<div class="lang"><button data-l="el">ΕΛ</button><button data-l="en">EN</button></div>

<div id="intro">
<div class="pn pl"><i></i></div><div class="pn pr"><i></i></div>
<button id="seal" aria-label="Open">
<svg viewBox="0 0 300 300"><defs>
<path id="pt" d="M40,150A110,110 0 0 1 260,150"/><path id="pb" d="M40,150A110,110 0 0 0 260,150"/>
<radialGradient id="sgr" cx=".36" cy=".3" r=".9"><stop offset="0" stop-color="#4a4a48"/><stop offset="1" stop-color="#060606"/></radialGradient></defs>
<text font-size="21" letter-spacing="1" fill="#0c0c0c" font-family="Jost,sans-serif"><textPath href="#pt" startOffset="50%" text-anchor="middle" id="t1"></textPath></text>
<text font-size="21" letter-spacing="1" fill="#0c0c0c" font-family="Jost,sans-serif"><textPath href="#pb" startOffset="50%" text-anchor="middle" id="t2"></textPath></text>
<g class="sg"><path d="M150 88c18-2 26 8 40 12 12 6 18 20 14 34 8 14 2 30-8 40-6 16-24 20-38 18-16 6-32-2-40-14-14-6-20-22-14-36-6-16 2-30 14-38 8-12 20-18 32-16z" fill="url(#sgr)"/>
<circle cx="150" cy="150" r="46" fill="none" stroke="#f3eee3" stroke-opacity=".3" stroke-width="1.6"/>
<text id="mono" x="150" y="163" text-anchor="middle" font-family="Bodoni Moda,Didot,serif" font-style="italic" font-size="40" fill="#f3eee3"></text></g>
</svg></button>
</div>

<header class="cover">
<div class="ph" id="cphoto" data-n="1"></div>
<div class="bar sm"><span id="vol"></span><span id="topdate"></span></div>
<h1 class="names"><span id="n1"></span><span><small>&amp;</small><span style="display:inline" id="n2"></span></span></h1>
<div class="sub sm" id="sub"></div>
<nav class="cl sm">
<a href="#details"><b>01</b><span data-t="nDay"></span></a><a href="#where"><b>02</b><span data-t="nLoc"></span></a>
<a href="#prog"><b>03</b><span data-t="nProg"></span></a><a href="#rsvp"><b>04</b><span data-t="nRsvp"></span></a>
</nav>
</header>

<section id="details"><div class="in">
<span class="k sm" data-t="kInv"></span>
<p class="q" data-t="hello"></p>
<div class="facts" id="facts"></div>
<div class="strip" id="strip" style="margin-top:44px"></div>
</div></section>

<section id="where" class="dark"><div class="in">
<span class="k sm" data-t="kLoc"></span>
<h2 data-t="locT"></h2>
<div class="loc"><span class="sm" data-t="lCer"></span><h3 id="cerW"></h3><iframe id="cerM" loading="lazy" title="Map"></iframe><a class="lnk sm" id="cerL" target="_blank" rel="noopener" data-t="open"></a></div>
<div class="loc"><span class="sm" data-t="lRec"></span><h3 id="recW"></h3><iframe id="recM" loading="lazy" title="Map"></iframe><a class="lnk sm" id="recL" target="_blank" rel="noopener" data-t="open"></a></div>
</div></section>

<section id="prog"><div class="in">
<span class="k sm" data-t="kProg"></span><h2 data-t="progT"></h2><div class="tl" id="tl"></div>
</div></section>

<section id="rsvp" style="padding-top:20px"><div class="in">
<span class="k sm" data-t="kRsvp"></span><h2 data-t="rsvpT"></h2><p data-t="rsvpP"></p>
<form id="f" novalidate>
<label class="sm" data-t="name"></label><input id="name" required autocomplete="name">
<label class="sm" data-t="contact"></label><input id="contact" required autocomplete="email">
<label class="sm" data-t="att"></label>
<div class="seg sm"><label><input type="radio" name="att" value="yes" checked><span data-t="yes"></span></label><label><input type="radio" name="att" value="no"><span data-t="no"></span></label></div>
<div id="more">
<div class="row"><div><label class="sm" data-t="extra"></label><input id="extra" type="number" min="0" max="10" value="0"></div>
<div><label class="sm" data-t="kids"></label><input id="kids" type="number" min="0" max="10" value="0"></div></div>
<label class="sm" data-t="note"></label><textarea id="note" rows="2"></textarea>
</div>
<button class="btn" type="submit" data-t="send"></button>
<div id="out"></div>
</form></div></section>

<footer><b id="fmono"></b><span class="sm" id="foot"></span></footer>

<script>
const CFG={
  n1:"Alex", n2:"Ando",
  date:"2027-07-10T18:00:00",            // ΑΛΛΑΞΕ ΗΜΕΡΟΜΗΝΙΑ/ΩΡΑ
  photos:["","",""],                     // βάλε εδώ τα URL ή τα αρχεία φωτογραφιών, π.χ. "photos/1.jpg"
  endpoint:"https://formspree.io/f/xppqeyod",
  sheet:"",                              // URL Google Sheet (Apps Script) - προαιρετικό
  email:"alexkotop@gmail.com",
  cer:{name:{el:"Παρεκκλήσι Αγίων Αλεξάνδρου και Μοδέστου",en:"Chapel of Saints Alexander and Modestus"},lat:40.5811854,lng:22.9425175},
  rec:{name:{el:"Κτήμα Χρηστίδη",en:"Ktima Christidi"},lat:40.4735258,lng:22.9310974},
  tl:[["18:00",{el:"Τελετή",en:"Ceremony"}],["20:00",{el:"Δεξίωση & δείπνο",en:"Reception & dinner"}],["22:00",{el:"Χορός & γλέντι",en:"Dancing & party"}]]
};
const T={
el:{i1:"πατήστε εδώ",i2:"για να ανοίξετε",vol:"Τεύχος Νο 01",sub:"Το Τεύχος του Γάμου · Θεσσαλονίκη",nDay:"Η Ημέρα",nLoc:"Τοποθεσία",nProg:"Πρόγραμμα",nRsvp:"Επιβεβαίωση",kInv:"Η Πρόσκληση",hello:"Με χαρά σας προσκαλούμε να γιορτάσετε μαζί μας τον γάμο μας.",lDate:"Ημερομηνία",lTime:"Ώρα",lCer:"Τελετή",lRec:"Δεξίωση",kLoc:"Σελίδα 02",locT:"Τοποθεσία",open:"Άνοιγμα τοποθεσίας ↗",kProg:"Σελίδα 03",progT:"Πρόγραμμα",kRsvp:"Σελίδα 04",rsvpT:"RSVP",rsvpP:"Παρακαλούμε επιβεβαιώστε την παρουσία σας το συντομότερο.",name:"Ονοματεπώνυμο",contact:"Email ή τηλέφωνο",att:"Θα παρευρεθείτε;",yes:"Ναι, με χαρά",no:"Δυστυχώς όχι",extra:"Επιπλέον άτομα",kids:"Εκ των οποίων παιδιά <5",note:"Μήνυμα / διατροφικές ανάγκες",send:"Αποστολή",ok:"Ευχαριστούμε! Η απάντησή σας καταγράφηκε.",bad:"Συμπληρώστε ονοματεπώνυμο και στοιχεία επικοινωνίας.",fb:"Η απευθείας καταχώριση δεν είναι διαθέσιμη. Στείλτε την απάντησή σας:",fbBtn:"Αποστολή με email / αντιγραφή",copied:"Αντιγράφηκε! Στείλτε το μήνυμα σε εμάς.",tot:"Σύνολο"},
en:{i1:"tap here",i2:"to open",vol:"Issue No. 01",sub:"The Wedding Issue · Thessaloniki",nDay:"The Day",nLoc:"Location",nProg:"Schedule",nRsvp:"RSVP",kInv:"The Invitation",hello:"We’re delighted to invite you to celebrate our wedding with us.",lDate:"Date",lTime:"Time",lCer:"Ceremony",lRec:"Reception",kLoc:"Page 02",locT:"Location",open:"Open location ↗",kProg:"Page 03",progT:"Schedule",kRsvp:"Page 04",rsvpT:"RSVP",rsvpP:"Please confirm your attendance as soon as you can.",name:"Full name",contact:"Email or phone",att:"Will you attend?",yes:"Yes, with joy",no:"Sadly, no",extra:"Additional guests",kids:"Of which children under 5",note:"Message / dietary needs",send:"Submit",ok:"Thank you! Your response has been recorded.",bad:"Please fill in your name and contact details.",fb:"Direct submission isn’t available. Send your reply instead:",fbBtn:"Send by email / copy",copied:"Copied! Please send the message to us.",tot:"Total"}
};
let L=(navigator.language||"el").startsWith("en")?"en":"el";
const $=id=>document.getElementById(id), D=new Date(CFG.date), p2=n=>String(n).padStart(2,"0");
const img=(i)=>CFG.photos[i]?`<img src="${CFG.photos[i]}" alt="" loading="lazy" onerror="this.remove()">`:"";
$("cphoto").innerHTML=img(0);
$("strip").innerHTML=[0,1,2].map(i=>`<figure class="ph" data-n="${i+1}" style="margin:0">${img(i)}</figure>`).join("");
const mono=(CFG.n1[0]+"&"+CFG.n2[0]).toUpperCase();$("mono").textContent=mono;$("fmono").textContent=mono;
function render(){
  const t=T[L];document.documentElement.lang=L;
  document.querySelectorAll("[data-t]").forEach(e=>e.textContent=t[e.dataset.t]);
  document.querySelectorAll(".lang button").forEach(b=>b.classList.toggle("on",b.dataset.l===L));
  $("t1").textContent=t.i1;$("t2").textContent=t.i2;$("vol").textContent=t.vol;$("sub").textContent=t.sub;
  $("n1").textContent=CFG.n1;$("n2").textContent=CFG.n2;
  $("topdate").textContent=p2(D.getDate())+"."+p2(D.getMonth()+1)+"."+D.getFullYear();
  $("foot").textContent=CFG.n1+" & "+CFG.n2+" · "+$("topdate").textContent;
  const ds=D.toLocaleDateString(L==="el"?"el-GR":"en-GB",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
  $("facts").innerHTML=[[t.lDate,ds],[t.lTime,CFG.date.slice(11,16)],[t.lCer,CFG.cer.name[L]],[t.lRec,CFG.rec.name[L]]].map(r=>`<div><span class="sm">${r[0]}</span><p>${r[1]}</p></div>`).join("");
  [["cer",CFG.cer],["rec",CFG.rec]].forEach(([k,c])=>{$(k+"W").textContent=c.name[L];if(!$(k+"M").getAttribute("src"))$(k+"M").src=`https://maps.google.com/maps?q=${c.lat},${c.lng}&z=16&output=embed`;$(k+"L").href=`https://www.google.com/maps/search/?api=1&query=${c.lat},${c.lng}`});
  $("tl").innerHTML=CFG.tl.map(r=>`<div><b>${r[0]}</b><span>${r[1][L]}</span></div>`).join("");
}
document.querySelectorAll(".lang button").forEach(b=>b.onclick=()=>{L=b.dataset.l;render()});
document.querySelectorAll("input[name=att]").forEach(r=>r.onchange=()=>$("more").style.display=document.querySelector("input[name=att]:checked").value==="yes"?"":"none");
function openInv(){const i=$("intro");if(i.classList.contains("open"))return;i.classList.add("open");setTimeout(()=>{i.classList.add("gone");document.body.classList.remove("lock");scrollTo(0,0)},1700)}
$("seal").onclick=openInv;

$("f").onsubmit=async e=>{
  e.preventDefault();const t=T[L],out=$("out");
  const name=$("name").value.trim(),contact=$("contact").value.trim();
  if(!name||!contact){out.innerHTML=`<div class="msg err">${t.bad}</div>`;return}
  const att=document.querySelector("input[name=att]:checked").value;
  const extra=att==="yes"?Math.max(0,+$("extra").value||0):0;
  const kids=att==="yes"?Math.min(extra,Math.max(0,+$("kids").value||0)):0;
  const rec={name,contact,attending:att==="yes",additionalGuests:extra,childrenUnder5:kids,totalPeople:att==="yes"?1+extra:0,note:$("note").value.trim(),lang:L,createdAt:new Date().toISOString()};
  try{
    if(!CFG.endpoint&&!CFG.sheet)throw 0;
    if(CFG.sheet)await fetch(CFG.sheet,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain"},body:JSON.stringify(rec)});
    if(CFG.endpoint){const r=await fetch(CFG.endpoint,{method:"POST",headers:{"Content-Type":"application/json","Accept":"application/json"},body:JSON.stringify(rec)});if(!r.ok)throw 0}
    out.innerHTML=`<div class="msg">${t.ok}</div>`;$("f").reset();
  }catch(_){
    const txt=`RSVP – ${CFG.n1} & ${CFG.n2}\n${name} (${contact})\n${att==="yes"?"✔":"✘"} | ${t.tot}: ${rec.totalPeople} | <5: ${kids}\n${rec.note}`;
    out.innerHTML=`<div class="msg err">${t.fb}<br><button type="button" class="btn" id="fb" style="margin-top:12px">${t.fbBtn}</button></div>`;
    $("fb").onclick=async()=>{
      if(CFG.email){location.href=`mailto:${CFG.email}?subject=RSVP&body=${encodeURIComponent(txt)}`;return}
      try{await navigator.clipboard.writeText(txt)}catch(_){}
      out.innerHTML=`<div class="msg">${t.copied}</div>`;
    };
  }
};
render();
</script>
</body>
</html>
